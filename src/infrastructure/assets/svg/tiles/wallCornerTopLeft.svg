<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48">
  <!-- Left Side Face of Vertical Wall -->
  <rect x="12" y="0" width="6" height="48" fill="#FDFEFE"/>
  <rect x="12" y="0" width="2" height="48" fill="#ECF0F1"/>

  <!-- Horizontal Wall Front Face (only from x=30 to 48) -->
  <rect x="30" y="12" width="18" height="36" fill="#FDFEFE"/>
  <!-- Accent Stripe -->
  <rect x="30" y="26" width="18" height="6" fill="#3498DB"/>
  <!-- Baseboard -->
  <rect x="30" y="44" width="18" height="4" fill="#BDC3C7"/>

  <!-- Right Side Face of Vertical Wall (only where horizontal wall doesn't cover, but actually it's an inner corner. We can draw it for depth) -->
  <rect x="30" y="12" width="6" height="36" fill="#BDC3C7"/>
  <rect x="34" y="12" width="2" height="36" fill="#7F8C8D"/>

  <!-- Top Face (L-Shape) -->
  <!-- Corner part -->
  <rect x="18" y="0" width="12" height="12" fill="#95A5A6"/>
  <!-- Horizontal part -->
  <rect x="30" y="0" width="18" height="12" fill="#95A5A6"/>
  <!-- Vertical part -->
  <rect x="18" y="12" width="12" height="36" fill="#95A5A6"/>

  <!-- Top Face Edge Highlights/Shadows -->
  <!-- Left edge of vertical top face -->
  <rect x="18" y="0" width="2" height="48" fill="#ECF0F1"/>
  <!-- Right edge of vertical top face (inner corner) -->
  <rect x="28" y="12" width="2" height="36" fill="#7F8C8D"/>
  
  <!-- Pillar Highlights -->
  <!-- Corner Pillar -->
  <rect x="18" y="0" width="12" height="8" fill="#7F8C8D"/>
  <!-- Pillar on horizontal wall -->
  <rect x="40" y="0" width="8" height="12" fill="#7F8C8D"/>
  <rect x="40" y="12" width="8" height="36" fill="#ECF0F1"/>
  <rect x="40" y="12" width="2" height="36" fill="#BDC3C7"/>
  <rect x="46" y="12" width="2" height="36" fill="#BDC3C7"/>
</svg>
