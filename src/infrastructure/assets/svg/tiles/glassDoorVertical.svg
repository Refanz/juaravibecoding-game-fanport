<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48">
  <!-- Left Side Face (giving a slight 3D pop, colored like the white wall) -->
  <rect x="12" y="0" width="6" height="8" fill="#FDFEFE"/>
  <rect x="12" y="40" width="6" height="8" fill="#FDFEFE"/>
  <rect x="16" y="8" width="2" height="32" fill="#BDC3C7"/>

  <!-- Left side subtle shadow -->
  <rect x="12" y="0" width="2" height="8" fill="#ECF0F1"/>
  <rect x="12" y="40" width="2" height="8" fill="#ECF0F1"/>

  <!-- Right Side Face (shadow side) -->
  <rect x="30" y="0" width="6" height="8" fill="#BDC3C7"/>
  <rect x="30" y="40" width="6" height="8" fill="#BDC3C7"/>
  <rect x="30" y="8" width="2" height="32" fill="#7F8C8D"/>

  <!-- Top Face (Main Vertical Wall) -->
  <rect x="18" y="0" width="12" height="8" fill="#95A5A6"/>
  <rect x="18" y="40" width="12" height="8" fill="#95A5A6"/>
  
  <!-- Top Face Edge Highlights/Shadows -->
  <rect x="18" y="0" width="2" height="8" fill="#ECF0F1"/>
  <rect x="28" y="0" width="2" height="8" fill="#7F8C8D"/>
  <rect x="18" y="40" width="2" height="8" fill="#ECF0F1"/>
  <rect x="28" y="40" width="2" height="8" fill="#7F8C8D"/>

  <!-- Top Face Pillar Highlights (Connecting ends) to match horizontal wall's 8px width -->
  <rect x="18" y="0" width="12" height="8" fill="#7F8C8D"/>
  <rect x="18" y="40" width="12" height="8" fill="#7F8C8D"/>
  
  <!-- Vertical Glass Door Insert (Replaces middle of the top face) -->
  <rect x="18" y="8" width="12" height="32" fill="#BDC3C7"/> <!-- frame -->
  <rect x="20" y="8" width="8" height="32" fill="#85C1E9"/> <!-- glass -->
  
  <!-- Glass reflection -->
  <polygon points="20,12 28,20 28,24 20,16" fill="#D4E6F1" opacity="0.6"/>
  <polygon points="20,26 28,34 28,38 20,30" fill="#D4E6F1" opacity="0.6"/>
  
  <!-- Center Line for Double Door -->
  <rect x="20" y="23.5" width="8" height="1" fill="#BDC3C7"/>
  
  <!-- Door Handles (Top View) -->
  <rect x="22" y="21" width="4" height="2" fill="#7F8C8D"/>
  <rect x="22" y="25" width="4" height="2" fill="#7F8C8D"/>
</svg>
