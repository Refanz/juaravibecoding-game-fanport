<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48">
  <!-- Left Side Horizontal Wall Front Face -->
  <rect x="0" y="12" width="12" height="36" fill="#FDFEFE"/>
  <rect x="0" y="26" width="12" height="6" fill="#3498DB"/>
  <rect x="0" y="44" width="12" height="4" fill="#BDC3C7"/>

  <!-- Right Side Face (Vertical wall right side) -->
  <rect x="30" y="0" width="6" height="48" fill="#BDC3C7"/>
  <!-- Right side darker shadow -->
  <rect x="34" y="0" width="2" height="48" fill="#7F8C8D"/>

  <!-- Top Face (Horizontal Wall on left) -->
  <rect x="0" y="0" width="18" height="12" fill="#95A5A6"/>

  <!-- Top Face (Main Vertical Wall) -->
  <rect x="18" y="0" width="12" height="48" fill="#95A5A6"/>
  
  <!-- Top Face Edge Highlights/Shadows -->
  <rect x="18" y="0" width="2" height="48" fill="#ECF0F1"/>
  <rect x="28" y="0" width="2" height="48" fill="#7F8C8D"/>

  <!-- Pillars -->
  <!-- Middle pillar connecting vertical -->
  <rect x="18" y="0" width="12" height="12" fill="#7F8C8D"/>
  
  <!-- Left pillar -->
  <rect x="0" y="0" width="8" height="12" fill="#7F8C8D"/>
  <rect x="0" y="12" width="8" height="36" fill="#ECF0F1"/>
  <rect x="0" y="12" width="2" height="36" fill="#BDC3C7"/>
  <rect x="6" y="12" width="2" height="36" fill="#BDC3C7"/>
</svg>