<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48">
  <!-- Right Side Face of Vertical Wall (Outer corner) -->
  <rect x="30" y="0" width="6" height="48" fill="#BDC3C7"/>
  <rect x="34" y="0" width="2" height="48" fill="#7F8C8D"/>

  <!-- Horizontal Wall Front Face -->
  <rect x="0" y="12" width="12" height="36" fill="#FDFEFE"/>
  <rect x="0" y="26" width="12" height="6" fill="#3498DB"/>
  <rect x="0" y="44" width="12" height="4" fill="#BDC3C7"/>

  <!-- Left Side Face of Vertical Wall (Inner corner) -->
  <rect x="12" y="12" width="6" height="36" fill="#FDFEFE"/>
  <rect x="12" y="12" width="2" height="36" fill="#ECF0F1"/>

  <!-- Top Face (L-Shape) -->
  <rect x="18" y="0" width="12" height="12" fill="#95A5A6"/> <!-- Corner -->
  <rect x="0" y="0" width="18" height="12" fill="#95A5A6"/>  <!-- Horizontal -->
  <rect x="18" y="12" width="12" height="36" fill="#95A5A6"/> <!-- Vertical -->

  <!-- Top Face Edge Highlights/Shadows -->
  <rect x="28" y="0" width="2" height="48" fill="#7F8C8D"/> <!-- Right edge -->
  <rect x="18" y="12" width="2" height="36" fill="#ECF0F1"/> <!-- Left edge inner -->
  
  <!-- Pillar Highlights -->
  <rect x="18" y="0" width="12" height="8" fill="#7F8C8D"/> <!-- Corner Pillar -->
  <rect x="0" y="0" width="8" height="12" fill="#7F8C8D"/> <!-- Left Pillar Top -->
  <rect x="0" y="12" width="8" height="36" fill="#ECF0F1"/> <!-- Left Pillar Front -->
  <rect x="0" y="12" width="2" height="36" fill="#BDC3C7"/>
  <rect x="6" y="12" width="2" height="36" fill="#BDC3C7"/>
</svg>
