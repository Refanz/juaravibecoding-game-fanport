<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48">
  <!-- Top Face (L-Shape from Top to Right) -->
  <rect x="18" y="0" width="30" height="12" fill="#95A5A6"/>
  <!-- Top Face Edge Highlights -->
  <rect x="18" y="0" width="2" height="12" fill="#ECF0F1"/> <!-- Left edge -->
  
  <!-- Left Side Face of Vertical Wall / Horizontal Wall end -->
  <rect x="12" y="0" width="6" height="48" fill="#FDFEFE"/>
  <rect x="12" y="0" width="2" height="48" fill="#ECF0F1"/>

  <!-- Horizontal Wall Front Face -->
  <rect x="18" y="12" width="30" height="36" fill="#FDFEFE"/>
  <rect x="18" y="26" width="30" height="6" fill="#3498DB"/>
  <rect x="18" y="44" width="30" height="4" fill="#BDC3C7"/>

  <!-- Front Pillar at the corner -->
  <rect x="18" y="0" width="12" height="8" fill="#7F8C8D"/> <!-- Top Pillar -->
  <rect x="18" y="12" width="12" height="36" fill="#ECF0F1"/>
  <rect x="18" y="12" width="2" height="36" fill="#BDC3C7"/>
  <rect x="28" y="12" width="2" height="36" fill="#BDC3C7"/>

  <!-- Right Pillar of horizontal wall -->
  <rect x="40" y="0" width="8" height="12" fill="#7F8C8D"/>
  <rect x="40" y="12" width="8" height="36" fill="#ECF0F1"/>
  <rect x="40" y="12" width="2" height="36" fill="#BDC3C7"/>
  <rect x="46" y="12" width="2" height="36" fill="#BDC3C7"/>
</svg>
