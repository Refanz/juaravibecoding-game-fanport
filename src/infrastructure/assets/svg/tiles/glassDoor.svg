<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48">
  <!-- Top Face -->
      <rect x="0" y="0" width="48" height="12" fill="#95A5A6"/>
      <!-- Top Face Pillar Highlights -->
      <rect x="0" y="0" width="8" height="12" fill="#7F8C8D"/>
      <rect x="40" y="0" width="8" height="12" fill="#7F8C8D"/>
      
      <!-- Door Frame -->
      <rect x="8" y="12" width="32" height="36" fill="#BDC3C7"/>
      <!-- Door Glass -->
      <rect x="10" y="14" width="28" height="34" fill="#85C1E9"/>
      
      <!-- Glass reflection -->
      <polygon points="14,48 34,14 38,14 18,48" fill="#D4E6F1" opacity="0.6"/>
      <polygon points="26,48 38,28 38,32 30,48" fill="#D4E6F1" opacity="0.6"/>
      
      <!-- Door Handle -->
      <rect x="12" y="30" width="2" height="6" fill="#7F8C8D" rx="1"/>
      <rect x="34" y="30" width="2" height="6" fill="#7F8C8D" rx="1"/>
      <!-- Center Line for Double Door -->
      <rect x="23.5" y="14" width="1" height="34" fill="#BDC3C7"/>
      
      <!-- Front Face Pillars (Edges) -->
      <rect x="0" y="12" width="8" height="36" fill="#ECF0F1"/>
      <rect x="0" y="12" width="2" height="36" fill="#BDC3C7"/>
      <rect x="6" y="12" width="2" height="36" fill="#BDC3C7"/>
      <rect x="40" y="12" width="8" height="36" fill="#ECF0F1"/>
      <rect x="40" y="12" width="2" height="36" fill="#BDC3C7"/>
      <rect x="46" y="12" width="2" height="36" fill="#BDC3C7"/>
</svg>
